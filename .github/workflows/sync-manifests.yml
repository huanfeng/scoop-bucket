name: Sync Manifests

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App name to sync (leave empty for all)"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.app }}" ]; then
            python scripts/sync_all_manifests.py --app "${{ github.event.inputs.app }}"
          else
            python scripts/sync_all_manifests.py
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync manifests to latest releases"
            git push
          fi
